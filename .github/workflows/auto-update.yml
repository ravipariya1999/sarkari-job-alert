
name: Auto Update Workflow

on:
  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-update.yml"
      - "scripts/fetch_jobs.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sarkari-job-auto-update
  cancel-in-progress: false

jobs:
  create-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Generate Draft Posts
        run: |
          python scripts/fetch_jobs.py

      - name: Create Review Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          add-paths: |
            _drafts/
          branch: job-drafts
          base: main
          delete-branch: true
          draft: true
          title: "New Government Job Updates - Review Required"
          commit-message: "Add verified job update drafts"
          body: |
            New government job updates are ready for review.
            Please verify all information and official links before approval.
            Do not publish without manual verification.
            
